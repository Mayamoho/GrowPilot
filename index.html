    <script>
      (function () {
        var NativeWS = window.WebSocket;
        if (!NativeWS) return;
        function PatchedWebSocket(url, protocols) {
          if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
            var target = new EventTarget();
            target.url = String(url || '');
            target.protocol = 'vite-hmr';
            target.readyState = 1;
            target.CONNECTING = 0;
            target.OPEN = 1;
            target.CLOSING = 2;
            target.CLOSED = 3;
            target.send = function () {};
            target.close = function () {
              target.readyState = 3;
            };
            setTimeout(function () {
              try {
                target.dispatchEvent(
                  new MessageEvent('message', { data: JSON.stringify({ type: 'connected' }) })
                );
              } catch (_e) {}
            }, 0);
            return target;
          }
          return protocols !== undefined ? new NativeWS(url, protocols) : new NativeWS(url);
        }
        PatchedWebSocket.prototype = NativeWS.prototype;
        PatchedWebSocket.CONNECTING = NativeWS.CONNECTING;
        PatchedWebSocket.OPEN = NativeWS.OPEN;
        PatchedWebSocket.CLOSING = NativeWS.CLOSING;
        PatchedWebSocket.CLOSED = NativeWS.CLOSED;
        window.WebSocket = PatchedWebSocket;
      })();
    </script>
