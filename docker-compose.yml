services:
  growpilot-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growpilot-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - GEMINI_MODEL_FLASH=${GEMINI_MODEL_FLASH:-gemini-3.5-flash}
      - GEMINI_MODEL_FLASH_LITE=${GEMINI_MODEL_FLASH_LITE:-gemini-3.1-flash-lite}
      - GEMINI_MODEL_LIVE=${GEMINI_MODEL_LIVE:-gemini-3.1-flash-live-preview}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/growpilot-lead}
      - N8N_USER=${N8N_USER:-}
      - N8N_PASSWORD=${N8N_PASSWORD:-}
      - GROWPILOT_STATE_FILE=/data/growpilot-state.json
    volumes:
      - growpilot_data:/data
    depends_on:
      - ollama
      - n8n
    networks:
      - growpilot-net

  ollama:
    image: ollama/ollama:latest
    container_name: growpilot-ollama
    restart: unless-stopped
    ports:
      # Configurable for the same reason as n8n: a host-installed Ollama already owns 11434.
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-llama3.2:3b} && wait" ]
    networks:
      - growpilot-net

  n8n:
    image: n8nio/n8n:latest
    container_name: growpilot-n8n
    restart: unless-stopped
    ports:
      # Host port is configurable because 5678 is n8n's own default and is often already
      # taken by another stack on the machine. Inside this network the container still
      # listens on 5678, so the agent's default N8N_WEBHOOK_URL (http://n8n:5678/...) is
      # unaffected — only the browser URL changes.
      - "${N8N_HOST_PORT:-5680}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:${N8N_HOST_PORT:-5680}/
      - GENERIC_TIMEZONE=Asia/Dhaka
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - growpilot-net

volumes:
  ollama_data:
  n8n_data:
  growpilot_data:

networks:
  growpilot-net:
    driver: bridge
